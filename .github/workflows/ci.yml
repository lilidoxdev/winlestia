name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: pwsh
        run: |
          foreach ($p in 'src/backend/Panneaux.Glass.csproj', 'src/files/Winlestia.Files.csproj', 'src/cli/winlestia.csproj') {
            dotnet build $p -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Tests xUnit (tests/Winlestia.Tests). La categorie Desktop (Audio, Explorateur, icones de dossiers, tiling,
      # bureaux virtuels, interop native, plein ecran) touche au bureau : elle reste locale.
      - name: Tests .NET
        shell: pwsh
        run: dotnet test tests/Winlestia.Tests -c Release --filter "Category!=Desktop"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests Python
        shell: pwsh
        run: |
          python -m pip install -r src/frontend/requirements.txt pytest
          pytest -q
